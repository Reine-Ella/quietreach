<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - QuietReach</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <span class="logo-icon">QR</span>
                    QuietReach
                </a>
                <h1>Create Account</h1>
                <p>Choose your role to get started</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <div class="form-group">
                    <label for="role">I am a...</label>
                    <select id="role" onchange="toggleSpecialty()">
                        <option value="mother">Young Mother</option>
                        <option value="mentor">Mentor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="username">Anonymous Username</label>
                    <input type="text" id="username" placeholder="Choose any username" required>
                    <p class="form-hint">No real name needed. This is your anonymous identity.</p>
                </div>

                <div class="form-group" id="specialtyGroup" style="display:none">
                    <label for="specialty">Area of Specialty</label>
                    <select id="specialty">
                        <option value="">Select specialty...</option>
                        <option value="Mental Health">Mental Health</option>
                        <option value="Parenting">Parenting</option>
                        <option value="Education">Education</option>
                        <option value="Life Skills">Life Skills</option>
                        <option value="General Support">General Support</option>
                    </select>
                    <p class="form-hint mentor-hint">Mentor accounts require admin approval before you can log in.</p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimum 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function toggleSpecialty() {
            const role = document.getElementById('role').value;
            const group = document.getElementById('specialtyGroup');
            group.style.display = role === 'mentor' ? 'flex' : 'none';
        }
    </script>
</body>
</html>
