<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - QuietReach</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card admin-theme">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <span class="logo-icon">QR</span>
                    QuietReach
                </a>
                <div class="role-badge admin-badge">ADMIN PORTAL</div>
                <h1>Admin Login</h1>
                <p>Access the administration dashboard</p>
            </div>

            <form class="auth-form" id="adminLoginForm">
                <div id="errorMessage" class="error-message"></div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full" style="background:#6366f1;border-color:#6366f1">Sign In as Admin</button>
            </form>

            <div class="auth-footer">
                <p>Are you a mentor or young mother?</p>
                <div class="switch-role">
                    <a href="login-mentor.html">Mentor Login</a> &bull;
                    <a href="login-mother.html">Mother Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
