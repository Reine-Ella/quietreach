version: "3.9"

services:
  quietreach:
    build: .
    container_name: quietreach-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SESSION_SECRET: quietreach-secret-key
      DB_DIR: /app/data
      DB_PATH: /app/data/quietreach.db
    volumes:
      - quietreach_data:/app/data
    restart: unless-stopped

volumes:
  quietreach_data:
  